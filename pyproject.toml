[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-alexa-qa-builder"
version = "1.0.0"
description = "Source-preserving raw and cleaned Amazon Alexa Q&A Codex Skill"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "playwright>=1.55,<2",
]

[project.scripts]
amazon-alexa-qa = "scripts.export_batch:main"

[tool.setuptools]
packages = ["scripts"]

[tool.setuptools.package-data]
scripts = ["*.mjs"]
